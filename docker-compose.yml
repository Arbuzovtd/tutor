services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorbot-pg
    environment:
      POSTGRES_USER: tutorbot
      POSTGRES_PASSWORD: tutorbot
      POSTGRES_DB: tutorbot
    ports:
      - "5433:5432"
    volumes:
      - tutorbot_pg:/var/lib/postgresql/data
      - ./scripts/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorbot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tutorbot_pg:
