services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutorbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tutorbot}
    # Tuned for a 1 GB-RAM Free Tier VM (Cloud.ru Evolution, etc.). The
    # defaults reserve ~150 MB of shared memory — too much for such a small
    # host. These overrides bring total Postgres footprint to ~80 MB.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tutorbot} -d ${POSTGRES_DB:-tutorbot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    # No host port — only the bot service can reach it via the docker network.

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set in .env}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tutorbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tutorbot}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_MAX_TOKENS: ${OPENAI_MAX_TOKENS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    ports:
      # Healthcheck only — never expose 8000 publicly.
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
